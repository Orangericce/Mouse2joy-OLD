[package]
name = "mouse2joy"
version = "0.1.0"
edition = "2021"

[dependencies]
evdev = "0.13"
gtk4 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"